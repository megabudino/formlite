<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f4faf6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#06120d" media="(prefers-color-scheme: dark)" />
		<link rel="preload" href="/fonts/instrument-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/instrument-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/bricolage-grotesque-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Apply the saved theme (or the OS preference) before first paint to avoid a flash.
			(function () {
				try {
					var saved = localStorage.getItem('fl-theme');
					var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
